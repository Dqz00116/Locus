plugins {
    id 'com.android.application'
}

def frpEngine = rootProject.file('frp-engine/build/locus-frp.aar')
tasks.register('checkFrpEngine') {
    doLast {
        if (!frpEngine.isFile()) {
            throw new GradleException('Build the FRP library with frp-engine/build.ps1 before assembling Locus.')
        }
    }
}
tasks.named('preBuild') {
    dependsOn 'checkFrpEngine'
}

abstract class StageProjectLicense extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.NONE)
    abstract RegularFileProperty getLicenseFile()

    @OutputDirectory
    abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void stage() {
        def target = outputDirectory.file('licenses/mpl-2.0.txt').get().asFile.toPath()
        java.nio.file.Files.createDirectories(target.parent)
        java.nio.file.Files.copy(licenseFile.get().asFile.toPath(), target,
                java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

def stageProjectLicense = tasks.register('stageProjectLicense', StageProjectLicense) {
    licenseFile.set(rootProject.layout.projectDirectory.file('LICENSE'))
    outputDirectory.set(layout.buildDirectory.dir('generated/assets/projectLicense'))
}

android {
    namespace 'dev.locus.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.locus.app'
        minSdk 28
        targetSdk 34
        versionCode 18
        versionName '0.5.0-beta.1'
        testInstrumentationRunner 'dev.locus.app.TerminalSmoke'
    }

    androidResources {
        generateLocaleConfig true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    splits {
        abi {
            enable providers.gradleProperty('locusAbiApks').map { it.toBoolean() }.getOrElse(false)
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk true
        }
    }

    lint {
        error 'HardcodedText', 'SetTextI18n', 'MissingTranslation', 'ExtraTranslation', 'StringFormatMatches'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets.addGeneratedSourceDirectory(stageProjectLicense) { it.outputDirectory }
    }
}

dependencies {
    implementation files(frpEngine)
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.87'
}
