plugins {
    id 'com.android.application'
}

def frpEngine = rootProject.file('frp-engine/build/locus-frp.aar')
tasks.register('checkFrpEngine') {
    doLast {
        if (!frpEngine.isFile()) {
            throw new GradleException('Build the FRP library with frp-engine/build.ps1 before assembling Locus.')
        }
    }
}
tasks.named('preBuild') {
    dependsOn 'checkFrpEngine'
}

android {
    namespace 'dev.locus.app'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.locus.app'
        minSdk 28
        targetSdk 34
        versionCode 15
        versionName '0.4.8-alpha'
        testInstrumentationRunner 'dev.locus.app.TerminalSmoke'
    }

    androidResources {
        generateLocaleConfig true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    lint {
        error 'HardcodedText', 'SetTextI18n', 'MissingTranslation', 'ExtraTranslation', 'StringFormatMatches'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation files(frpEngine)
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.87'
}
